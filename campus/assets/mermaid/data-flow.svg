#mmd-dataflow .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#mmd-dataflow .rough-node .label,#mmd-dataflow .node .label,#mmd-dataflow .image-shape .label,#mmd-dataflow .icon-shape .label{text-align:center;}#mmd-dataflow .node.clickable{cursor:pointer;}#mmd-dataflow .root .anchor path{fill:lightgrey!important;stroke-width:0;stroke:lightgrey;}#mmd-dataflow .arrowheadPath{fill:lightgrey;}#mmd-dataflow .edgePath .path{stroke:lightgrey;stroke-width:2.0px;}#mmd-dataflow .flowchart-link{stroke:lightgrey;fill:none;}#mmd-dataflow .edgeLabel{background-color:hsl(0, 0%, 34.4117647059%);text-align:center;}#mmd-dataflow .edgeLabel p{background-color:hsl(0, 0%, 34.4117647059%);}#mmd-dataflow .edgeLabel rect{opacity:0.5;background-color:hsl(0, 0%, 34.4117647059%);fill:hsl(0, 0%, 34.4117647059%);}#mmd-dataflow .labelBkg{background-color:rgba(87.75, 87.75, 87.75, 0.5);}#mmd-dataflow .cluster rect{fill:hsl(180, 1.5873015873%, 28.3529411765%);stroke:rgba(255, 255, 255, 0.25);stroke-width:1px;}#mmd-dataflow .cluster text{fill:#F9FFFE;}#mmd-dataflow .cluster span{color:#F9FFFE;}#mmd-dataflow div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:12px;background:hsl(20, 1.5873015873%, 12.3529411765%);border:1px solid rgba(255, 255, 255, 0.25);border-radius:2px;pointer-events:none;z-index:100;}#mmd-dataflow .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#ccc;}#mmd-dataflow rect.text{fill:none;stroke-width:0;}#mmd-dataflow .icon-shape,#mmd-dataflow .image-shape{background-color:hsl(0, 0%, 34.4117647059%);text-align:center;}#mmd-dataflow .icon-shape p,#mmd-dataflow .image-shape p{background-color:hsl(0, 0%, 34.4117647059%);padding:2px;}#mmd-dataflow .icon-shape rect,#mmd-dataflow .image-shape rect{opacity:0.5;background-color:hsl(0, 0%, 34.4117647059%);fill:hsl(0, 0%, 34.4117647059%);}#mmd-dataflow .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.12