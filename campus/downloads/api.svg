<text x="40" y="86" font-size="16" fill="#1b140f">Client credentials are for a service. The token cannot call /api/v2/users/me.</text><text x="40" y="108" font-size="16" fill="#1b140f">User-facing apps use authorization code with PKCE.</text><text x="40" y="130" font-size="16" fill="#1b140f">Token Implicit Grant is documented as deprecated after 25 May 2026.</text><text x="40" y="152" font-size="16" fill="#1b140f">A role works only in the divisions it is paired with.</text><text x="40" y="174" font-size="16" fill="#1b140f">This lab’s API explorer never sends the sample.</text><text x="40" y="196" font-size="16" fill="#1b140f">CypherMonkey Labs · Signal Floor</text><text x="40" y="218" font-size="16" fill="#1b140f">© 2026 CypherMonkeyLabs</text><text x="40" y="240" font-size="16" fill="#1b140f">https://cyphermonkeylabs.com</text><text x="40" y="262" font-size="16" fill="#1b140f">https://linktr.ee/cyphermonkey</text><text x="40" y="284" font-size="16" fill="#1b140f">https://github.com/cipher0x9/genesys-cloud-lab-free-university-mesmerizing</text><text x="40" y="306" font-size="16" fill="#1b140f">https://github.com/CypherMonkeyLabs/genesys-cloud-lab-free-university-mesmerizing</text><text x="40" y="328" font-size="16" fill="#1b140f">Independent educational project. Not affiliated with or endorsed by any vendor.</text><text x="40" y="350" font-size="16" fill="#1b140f">Trademarks belong to their owners. MIT code. CC BY-NC-SA content.</text><text x="40" y="372" font-size="16" fill="#1b140f">Concerns: https://cyphermonkeylabs.com/#contact</text>
