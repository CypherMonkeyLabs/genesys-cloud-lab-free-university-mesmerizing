<text x="40" y="86" font-size="16" fill="#1b140f">TLS 1.2 on 5061 for signaling. SRTP for audio. IPsec is not the secure-trunk method.</text><text x="40" y="108" font-size="16" fill="#1b140f">Kind: chain</text><text x="40" y="130" font-size="16" fill="#1b140f">Flow: yes</text><text x="40" y="152" font-size="16" fill="#1b140f">Confirm before relying. The cited page wins.</text>
