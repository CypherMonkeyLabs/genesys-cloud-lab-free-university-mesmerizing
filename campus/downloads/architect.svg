<text x="40" y="42" fill="#ff5a36" font-size="24" font-family="Georgia, serif">Architect checklist</text>
<text x="40" y="86" font-size="16" fill="#1b140f">Pick the flow type before you draw. Inbound, in-queue, bot, and secure are different types.</text><text x="40" y="108" font-size="16" fill="#1b140f">Give every path a transfer, a handoff, or a disconnect.</text><text x="40" y="130" font-size="16" fill="#1b140f">Call a bot from the inbound flow. Bind no-match, timeout, and error to a queue.</text><text x="40" y="152" font-size="16" fill="#1b140f">A secure flow keeps payment audio out of the recording. It is not a place to store the digits.</text><text x="40" y="174" font-size="16" fill="#1b140f">Save is a draft. Publish is what answers.</text><text x="40" y="196" font-size="16" fill="#1b140f">CypherMonkey Labs · Signal Floor</text><text x="40" y="218" font-size="16" fill="#1b140f">© 2026 CypherMonkeyLabs</text><text x="40" y="240" font-size="16" fill="#1b140f">https://github.com/cipher0x9</text><text x="40" y="262" font-size="16" fill="#1b140f">https://github.com/CypherMonkeyLabs</text><text x="40" y="284" font-size="16" fill="#1b140f">https://cyphermonkeylabs.com</text><text x="40" y="306" font-size="16" fill="#1b140f">https://x.com/Cypher0x9</text><text x="40" y="328" font-size="16" fill="#1b140f">https://www.linkedin.com/in/luckylakshmanucwebex</text><text x="40" y="350" font-size="16" fill="#1b140f">https://huggingface.co/Cypher0x9</text><text x="40" y="372" font-size="16" fill="#1b140f">https://github.com/CypherMonkeyLabs/genesys-cloud-lab-free-university-mesmerizing</text><text x="40" y="394" font-size="16" fill="#1b140f">Independent educational project. Not affiliated with or endorsed by any vendor.</text><text x="40" y="416" font-size="16" fill="#1b140f">Trademarks belong to their owners. MIT code. CC BY-NC-SA content.</text><text x="40" y="438" font-size="16" fill="#1b140f">Concerns: https://cyphermonkeylabs.com/#contact</text>
