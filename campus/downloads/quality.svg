<text x="40" y="42" fill="#ff5a36" font-size="24" font-family="Georgia, serif">Recording and quality</text>
<text x="40" y="86" font-size="16" fill="#1b140f">Quality management evaluates. It does not build the schedule.</text><text x="40" y="108" font-size="16" fill="#1b140f">Recording policies choose calls and retention.</text><text x="40" y="130" font-size="16" fill="#1b140f">A secure flow can suppress a payment segment. It does not replace the policy.</text><text x="40" y="152" font-size="16" fill="#1b140f">AI scoring needs speech and text analytics, quality management, and AI Experience tokens.</text><text x="40" y="174" font-size="16" fill="#1b140f">A score the agent cannot see and cannot dispute is not a quality program.</text><text x="40" y="196" font-size="16" fill="#1b140f">CypherMonkey Labs · Signal Floor</text><text x="40" y="218" font-size="16" fill="#1b140f">© 2026 CypherMonkeyLabs</text><text x="40" y="240" font-size="16" fill="#1b140f">https://cyphermonkeylabs.com</text><text x="40" y="262" font-size="16" fill="#1b140f">https://linktr.ee/cyphermonkey</text><text x="40" y="284" font-size="16" fill="#1b140f">https://github.com/cipher0x9/genesys-cloud-lab-free-university-mesmerizing</text><text x="40" y="306" font-size="16" fill="#1b140f">https://github.com/CypherMonkeyLabs/genesys-cloud-lab-free-university-mesmerizing</text><text x="40" y="328" font-size="16" fill="#1b140f">Independent educational project. Not affiliated with or endorsed by any vendor.</text><text x="40" y="350" font-size="16" fill="#1b140f">Trademarks belong to their owners. MIT code. CC BY-NC-SA content.</text><text x="40" y="372" font-size="16" fill="#1b140f">Concerns: https://cyphermonkeylabs.com/#contact</text>
